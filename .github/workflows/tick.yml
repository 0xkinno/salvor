name: Backup knock
# The second wake source. The first is the Apify schedule webhook. If that webhook ever fails, this cron asks
# slv-home to wake each receipt Sprite against the newest finished run. Both are idempotent by run id, and the
# endpoint is rate limited to one knock per 20 minutes, so it needs no secret.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Knock slv-home
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "https://slv-home-b6y6f.sprites.app/tick")
          echo "HTTP $code"; cat /tmp/out; echo
          test "$code" = "202" || test "$code" = "429"
